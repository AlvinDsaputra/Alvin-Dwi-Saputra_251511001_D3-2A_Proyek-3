<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilihan Paket Lokakarya</title>
  <link rel="stylesheet" href="css/pricing.css">
</head>
<body>

  <section class="pricing" aria-labelledby="pricing-title">
    <div class="container">
      <h1 id="pricing-title">Pilihan Paket Lokakarya</h1>
      
      <div class="pricing-list">
        <!-- Kartu 1 -->
        <article class="price-card">
          <h2>Mandiri</h2>
          <p class="price">Gratis</p>
          <ul>
            <li>Materi dasar</li>
            <li>Latihan mandiri</li>
          </ul>
          <a class="button" href="#daftar">Pilih paket</a>
        </article>

        <!-- Kartu 2 (Featured) -->
        <article class="price-card price-card--featured">
          <p class="badge">Rekomendasi</p>
          <h2>Terbimbing</h2>
          <p class="price">Rp150.000</p>
          <ul>
            <li>Materi dasar</li>
            <li>Review tugas</li>
            <li>Code defense</li>
          </ul>
          <a class="button" href="#daftar">Pilih paket</a>
        </article>

        <!-- Kartu 3 -->
        <article class="price-card">
          <h2>Intensif</h2>
          <p class="price">Rp250.000</p>
          <ul>
            <li>Semua fasilitas</li>
            <li>Konsultasi tambahan</li>
          </ul>
          <a class="button" href="#daftar">Pilih paket</a>
        </article>
      </div>
    </div>
  </section>
  <footer> <p>Jangan Lupa Berlangganan Guys</p></footer>
</body>
</html>
